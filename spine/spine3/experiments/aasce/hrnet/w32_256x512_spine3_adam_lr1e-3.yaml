GPUS: (0,)
WORKERS: 4
PRINT_FREQ: 20

CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true

DATASET:
  COLOR_RGB: true
  DATASET: 'aasce'
  DATA_FORMAT: jpg
  FLIP: false
  NUM_JOINTS_HALF_BODY: 9999
  PROB_HALF_BODY: 0.0
  ROOT: '../data/aasce'
  ROT_FACTOR: 10
  SCALE_FACTOR: 0.15
  TEST_SET: 'val'
  TRAIN_SET: 'train'

MODEL:
  NAME: pose_hrnet
  INIT_WEIGHTS: true
  PRETRAINED: 'lib/models/hrnet_w32-36af842e.pth'
  NUM_JOINTS: 68
  TARGET_TYPE: gaussian
  IMAGE_SIZE:
    - 256
    - 512
  HEATMAP_SIZE:
    - 64
    - 128
  SIGMA: 2
  EXTRA:
    PRETRAINED_LAYERS:
      - '*'
    FINAL_CONV_KERNEL: 1
    STAGE2:
      NUM_MODULES: 1
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
      NUM_CHANNELS:
        - 32
        - 64
      FUSE_METHOD: SUM
    STAGE3:
      NUM_MODULES: 4
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 32
        - 64
        - 128
      FUSE_METHOD: SUM
    STAGE4:
      NUM_MODULES: 3
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 32
        - 64
        - 128
        - 256
      FUSE_METHOD: SUM

LOSS:
  USE_TARGET_WEIGHT: true
  USE_DIFFERENT_JOINTS_WEIGHT: false

TRAIN:
  BATCH_SIZE_PER_GPU: 2
  BEGIN_EPOCH: 0
  END_EPOCH: 100
  SHUFFLE: true
  OPTIMIZER: adam
  LR: 0.001
  LR_FACTOR: 0.1
  LR_STEP:
    - 60
    - 80
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false

TEST:
  BATCH_SIZE_PER_GPU: 2
  FLIP_TEST: false
  POST_PROCESS: true
  SHIFT_HEATMAP: false
  USE_GT_BBOX: true
